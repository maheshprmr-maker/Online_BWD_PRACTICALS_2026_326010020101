
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
        }

        header {
            background-color: #123c69;
            color: white;
            padding: 25px;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 20px;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        img, video {
            max-width: 100%;
            border-radius: 8px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        footer {
            background-color: #123c69;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Annual College Fest 2026</h1>
        <p>Celebrating Creativity, Talent and Innovation!</p>
    </header>

    <main>
        <section>
            <h2>Event Photograph</h2>
            <img src="event-photo.jpg"
                 alt="Students participating in the college festival"
                 width="700">
            <p>Join us for an exciting celebration of student talent.</p>
        </section>

        <section>
            <h2>Promotional Audio</h2>
            <p>Listen to our college fest announcement.</p>
            <audio controls>
                <source src="promotion.mp3" type="audio/mpeg">
                <source src="promotion.ogg" type="audio/ogg">
                Your browser does not support audio playback.
            </audio>
        </section>

        <section>
            <h2>Event Video</h2>
            <video controls width="700" poster="event-photo.jpg">
                <source src="event-video.mp4" type="video/mp4">
                <source src="event-video.webm" type="video/webm">
                Your browser does not support video playback.
            </video>
        </section>
    </main>

  
</body>
</html>
